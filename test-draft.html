<!DOCTYPE html>
<html>
<head>
    <title>htmx 4.0 Draft Test</title>
    <style>
        body { font-family: system-ui; padding: 2rem; }
        button { padding: 0.5rem 1rem; margin: 0.5rem; }
        #result { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; min-height: 50px; }
        [data-htmx] { outline: 2px solid green; }
    </style>
</head>
<body>
    <h1>htmx 4.0 Draft Test</h1>

    <h2>Basic Triggers</h2>
    <button hx-get="/test" hx-target="#result">Click me (hx-get)</button>
    <button hx-get="/test" hx-trigger="mouseenter" hx-target="#result">Hover me</button>

    <h2>Modifiers</h2>
    <button hx-get="/test" hx-trigger="click delay:500ms" hx-target="#result">Delay 500ms</button>
    <button hx-get="/test" hx-trigger="click throttle:1000ms" hx-target="#result">Throttle 1s</button>

    <h2>Form</h2>
    <form hx-post="/submit" hx-target="#result">
        <input type="text" name="message" placeholder="Type something">
        <button type="submit">Submit</button>
    </form>

    <h2>Input (change trigger)</h2>
    <input type="text" hx-get="/search" hx-trigger="input delay:300ms" hx-target="#result" placeholder="Type to search">

    <h2>Extra Values (hx-vals)</h2>
    <button hx-post="/action" hx-vals='{"foo": "bar", "count": 42}' hx-target="#result">POST with hx-vals</button>

    <h2>Result</h2>
    <div id="result">Results will appear here</div>

    <script src="src/htmx.draft.js"></script>
    <script>
        htmx.config.debug = true;

        // Mock fetch to avoid needing a server
        window.fetch = async (url, options = {}) => {
            await new Promise(r => setTimeout(r, 200));
            const body = options.body?.toString() || '(no body)';
            return new Response(`<div>Response from ${url}<br>Body: ${body}</div>`, {
                status: 200,
                headers: { 'Content-Type': 'text/html' }
            });
        };
    </script>
</body>
</html>
