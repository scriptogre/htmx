<!DOCTYPE html>
<html>
<head>
    <title>htmx 4.0 — Full Bundle</title>
    <style>
        body { font-family: system-ui; padding: 2rem; max-width: 900px; margin: 0 auto; }
        .test { margin: 1rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; }
        .test h3 { margin: 0 0 0.5rem; }
        .pass { color: #2a2; } .fail { color: #a22; font-weight: bold; }
        pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; }
        #results { margin-top: 2rem; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>htmx 4.0 — Full Bundle Test</h1>
    <p>All extensions loaded individually. Replaces test-kernel.html.</p>
    <pre id="log"></pre>

    <!-- Test elements for manual/automated tests -->
    <div class="test" id="test-click">
        <h3>Click trigger (default)</h3>
        <button hx-get="/api/hello" hx-target="#target">Click me</button>
    </div>

    <div class="test" id="test-swap-target">
        <h3>Swap into target</h3>
        <button hx-get="/api/hello" hx-target="#target" hx-swap="innerHTML">Swap into target</button>
        <div id="target">Original content</div>
    </div>

    <div id="results"></div>

    <!-- Core -->
    <script src="../src/htmx.core.js"></script>

    <!-- Extensions in registration order (matches htmx.defaults.js) -->
    <script src="../src/defaults/extended-selectors.js"></script>
    <script src="../src/defaults/inheritance.js"></script>
    <script src="../src/defaults/parse-dot-path.js"></script>
    <script src="../src/defaults/method-attrs.js"></script>
    <script src="../src/defaults/trigger-attrs.js"></script>
    <script src="../src/defaults/boost.js"></script>
    <script src="../src/defaults/default-swap.js"></script>
    <script src="../src/defaults/default-headers.js"></script>
    <script src="../src/defaults/default-trigger.js"></script>
    <script src="../src/defaults/swap-style-aliases.js"></script>
    <script src="../src/defaults/timeout.js"></script>
    <script src="../src/defaults/load.js"></script>
    <script src="../src/defaults/every.js"></script>
    <script src="../src/defaults/once.js"></script>
    <script src="../src/defaults/delay.js"></script>
    <script src="../src/defaults/throttle.js"></script>
    <script src="../src/defaults/from.js"></script>

    <script>
    // ═══════════════════════════════════════════════════════════════════
    // Mock fetch
    // ═══════════════════════════════════════════════════════════════════

    const realFetch = window.fetch
    window.fetch = async (url, options = {}) => {
        log(`fetch: ${options.method || 'GET'} ${url}`)
        await new Promise(r => setTimeout(r, 10))
        return new Response(`<p>Response from ${url}</p>`, {
            status: 200,
            headers: {'Content-Type': 'text/html'},
        })
    }

    // ═══════════════════════════════════════════════════════════════════
    // Test runner
    // ═══════════════════════════════════════════════════════════════════

    const results = []

    function assert(name, condition, detail) {
        results.push({name, pass: !!condition, detail})
        if (!condition) console.error(`FAIL: ${name}`, detail)
    }

    function log(msg) {
        const el = document.getElementById('log')
        el.textContent += msg + '\n'
        console.log(msg)
    }

    function showResults() {
        const passed = results.filter(r => r.pass).length
        const total = results.length
        const el = document.getElementById('results')
        el.textContent = `${passed}/${total} tests passed`
        el.style.color = passed === total ? '#4a4' : '#a44'
        document.title = `${passed}/${total} passed`

        for (const r of results) {
            const div = document.createElement('div')
            div.className = 'test ' + (r.pass ? 'pass' : 'fail')
            div.innerHTML = `<b>${r.pass ? 'PASS' : 'FAIL'}:</b> ${r.name}`
            if (!r.pass && r.detail) div.innerHTML += `<br><span style="font-family:monospace;font-size:12px">${r.detail}</span>`
            el.after(div)
        }
    }

    // ═══════════════════════════════════════════════════════════════════
    // Tests — mirrors test-kernel.html coverage
    // ═══════════════════════════════════════════════════════════════════

    async function runTests() {
        await new Promise(r => setTimeout(r, 50))

        testParse()
        testAttr()
        testInit()
        await testClickPipeline()
        await testPostMethod()
        testDefaultTriggers()
        await testSwapStyles()
        await testLoadTrigger()
        await testEvents()

        showResults()
    }

    function testParse() {
        const p = htmx.parse

        const r1 = p('click delay:300ms once')
        assert('parse: bare value + modifiers',
            r1.value === 'click' && r1.delay === 300 && r1.once === true,
            JSON.stringify(r1))

        const r2 = p('innerHTML')
        assert('parse: single bare value',
            r2.value === 'innerHTML',
            JSON.stringify(r2))

        const r3 = p('key:value')
        assert('parse: key:value only (no bare value)',
            r3.key === 'value' && r3.value === undefined,
            JSON.stringify(r3))

        assert('parse: null input', p(null) === null)
        assert('parse: empty string', p('') === null)

        const r4 = p('2s')
        assert('parse: duration as bare value',
            r4.value === '2s',
            JSON.stringify(r4))

        const r5 = p('foo delay:2s')
        assert('parse: duration coercion in modifier',
            r5.value === 'foo' && r5.delay === 2000,
            JSON.stringify(r5))
    }

    function testAttr() {
        const div = document.createElement('div')
        div.setAttribute('hx-trigger', 'click delay:300ms')
        div.setAttribute('hx-swap', 'innerHTML')
        div.setAttribute('hx-target', '#foo')
        div.setAttribute('hx-get', '/api/test')

        const trigger = htmx.attr(div, 'hx-trigger', {as: 'eventName'})
        assert('attr: hx-trigger with {as: eventName}',
            trigger.eventName === 'click' && trigger.delay === 300,
            JSON.stringify(trigger))

        const swap = htmx.attr(div, 'hx-swap', {as: 'style'})
        assert('attr: hx-swap with {as: style}',
            swap.style === 'innerHTML',
            JSON.stringify(swap))

        const target = htmx.attr(div, 'hx-target', {as: 'selector'})
        assert('attr: hx-target with {as: selector}',
            target.selector === '#foo',
            JSON.stringify(target))

        const get = htmx.attr(div, 'hx-get', {as: 'url'})
        assert('attr: hx-get with {as: url}',
            get.url === '/api/test',
            JSON.stringify(get))

        assert('attr: missing attribute returns null',
            htmx.attr(div, 'hx-post') === null)

        const noAs = htmx.attr(div, 'hx-trigger')
        assert('attr: without {as} keeps value key',
            noAs.value === 'click',
            JSON.stringify(noAs))
    }

    function testInit() {
        const btn = document.querySelector('#test-click button')
        assert('init: button with hx-get was initialized',
            btn && btn.__htmxInitialized !== false)
    }

    async function testClickPipeline() {
        const btn = document.querySelector('#test-swap-target button')
        const target = document.getElementById('target')
        target.textContent = 'Original content'

        btn.click()
        await new Promise(r => setTimeout(r, 100))

        assert('click\u2192ajax\u2192swap: target content replaced',
            target.textContent.includes('Response from'),
            `target.textContent = "${target.textContent}"`)
    }

    async function testPostMethod() {
        const div = document.createElement('div')
        div.innerHTML = '<button hx-post="/api/submit" hx-swap="none">Post</button>'
        document.body.appendChild(div)
        await new Promise(r => setTimeout(r, 50))
        htmx.init(div)

        let capturedMethod = null
        const origFetch = window.fetch
        window.fetch = async (url, options = {}) => {
            capturedMethod = options.method
            return new Response('ok', {status: 200})
        }

        div.querySelector('button').click()
        await new Promise(r => setTimeout(r, 50))
        window.fetch = origFetch

        assert('POST: fetch called with POST method',
            capturedMethod === 'POST',
            `method = "${capturedMethod}"`)

        div.remove()
    }

    function testDefaultTriggers() {
        const btn = document.createElement('button')
        btn.setAttribute('hx-get', '/x')
        const input = document.createElement('input')
        input.setAttribute('hx-get', '/x')
        const form = document.createElement('form')
        form.setAttribute('hx-get', '/x')

        const triggers = {}
        const handler = (e) => {
            const tag = e.detail.element.tagName.toLowerCase()
            triggers[tag] = e.detail.trigger.eventName
        }
        document.body.addEventListener('htmx:config:init', handler)

        const container = document.createElement('div')
        container.append(btn, input, form)
        document.body.appendChild(container)
        htmx.init(container)

        document.body.removeEventListener('htmx:config:init', handler)
        container.remove()

        assert('default-trigger: button gets click',
            triggers.button === 'click',
            `button trigger = "${triggers.button}"`)

        assert('default-trigger: input gets change',
            triggers.input === 'change',
            `input trigger = "${triggers.input}"`)

        assert('default-trigger: form gets submit',
            triggers.form === 'submit',
            `form trigger = "${triggers.form}"`)
    }

    async function testSwapStyles() {
        const container = document.createElement('div')
        container.id = 'swap-test-target'
        container.textContent = 'Before'
        document.body.appendChild(container)

        htmx.swap({content: '<b>After</b>', target: container, style: 'beforeend'})
        assert('swap: beforeend appends content',
            container.innerHTML.includes('Before') && container.innerHTML.includes('After'),
            `innerHTML = "${container.innerHTML}"`)

        const wrapper = document.createElement('div')
        const child = document.createElement('span')
        child.id = 'outer-test'
        child.textContent = 'old'
        wrapper.appendChild(child)
        document.body.appendChild(wrapper)

        htmx.swap({content: '<em>new</em>', target: child, style: 'outerHTML'})
        assert('swap: outerHTML replaces element',
            wrapper.innerHTML === '<em>new</em>',
            `wrapper.innerHTML = "${wrapper.innerHTML}"`)

        const toDelete = document.createElement('div')
        toDelete.id = 'delete-test'
        document.body.appendChild(toDelete)
        htmx.swap({target: toDelete, style: 'delete'})
        assert('swap: delete removes element',
            !document.getElementById('delete-test'))

        container.remove()
        wrapper.remove()
    }

    async function testLoadTrigger() {
        const div = document.createElement('div')
        div.innerHTML = '<span hx-get="/api/loaded" hx-trigger="load" hx-swap="none"></span>'

        let loadFired = false
        const origFetch = window.fetch
        window.fetch = async (url, options = {}) => {
            if (url === '/api/loaded') loadFired = true
            return new Response('ok', {status: 200})
        }

        document.body.appendChild(div)
        await new Promise(r => setTimeout(r, 100))

        window.fetch = origFetch

        assert('trigger-load: fires fetch on init', loadFired)

        div.remove()
    }

    async function testEvents() {
        const div = document.createElement('div')
        div.innerHTML = '<button hx-get="/api/events">Go</button>'
        document.body.appendChild(div)
        await new Promise(r => setTimeout(r, 50))
        htmx.init(div)

        const events = []
        for (const name of ['htmx:before:request', 'htmx:after:request', 'htmx:before:swap', 'htmx:after:swap', 'htmx:done', 'htmx:finally']) {
            document.body.addEventListener(name, () => events.push(name), {once: true})
        }

        div.querySelector('button').click()
        await new Promise(r => setTimeout(r, 100))

        assert('events: full pipeline fires in order',
            events.length === 6 &&
            events[0] === 'htmx:before:request' &&
            events[1] === 'htmx:after:request' &&
            events[2] === 'htmx:before:swap' &&
            events[3] === 'htmx:after:swap' &&
            events[4] === 'htmx:done' &&
            events[5] === 'htmx:finally',
            `events = [${events.join(', ')}]`)

        div.remove()
    }

    runTests()
    </script>
</body>
</html>
